<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cephe Hattı</title>
<style>
:root{--sysnav:24px;--bg:#121212;--card:#1e1e1e;--ink:#e0e0e0;--mut:#8a8a8a;--line:#333333;--acc:#2ecc71;--war:#e74c3c;--gold:#f1c40f;--nav:#1e1e1eee;--chip:#2c2c2c;--sh:0 4px 12px #00000040;color-scheme:dark;}
*{box-sizing:border-box;outline:none}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(80px + var(--sysnav,48px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--nav);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--nav);backdrop-filter:blur(14px);padding:12px 16px;box-shadow:var(--sh);border-bottom:1px solid var(--line);z-index:5}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
#hm,#hg{background:var(--chip);padding:4px 12px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;transition:transform 0.1s}
.bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--acc);transition:width .5s}
.bar.w i{background:var(--war)}
main{padding:0 10px}
.card{background:var(--card);border-radius:12px;padding:14px;margin:10px 0;border:1px solid var(--line)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.c{text-align:center;padding:10px 4px}
.k{color:var(--mut);font-size:13px}.v{font-weight:800;font-size:20px}
button{font:inherit;border:0;border-radius:8px;padding:10px 16px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer;width:100%;margin-top:8px;transition:transform .1s, opacity .2s}
button:active{transform:scale(.97)}button.w{background:var(--war)}button.s{background:var(--chip);color:var(--ink)}button:disabled{opacity:.45;cursor:not-allowed}
select,input,textarea{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--ink);width:100%}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--nav);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:5;padding:6px 0 calc(6px + max(env(safe-area-inset-bottom,0px),var(--sysnav,48px)))}
nav a{flex:1;text-align:center;padding:2px 0;font-size:9px;font-weight:600;color:var(--mut);text-decoration:none;transition:color .2s}nav a i{display:block;font-style:normal;font-size:18px;line-height:1.2;margin-bottom:2px}
nav a.on{color:var(--acc)}
#toast{position:fixed;left:14px;right:14px;bottom:calc(80px + max(env(safe-area-inset-bottom,0px),var(--sysnav,48px)));background:#333;color:#fff;padding:12px;border-radius:8px;display:none;z-index:20;text-align:center;animation:up .3s;box-shadow:0 4px 12px #0004}
@keyframes up{from{transform:translateY(20px);opacity:0}}
.tag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600;color:#fff}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}
.sm{width:auto;padding:6px 10px;margin:0;font-size:13px}.ur{display:flex;align-items:center;gap:8px;margin:6px 0}.ur span{flex:1}.ur input{width:80px}
.rs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0}.rs div{background:var(--chip);border-radius:8px;padding:8px 2px;text-align:center;font-size:12px;border:1px solid var(--line)}

/* AKORDEON TASARIMI */
details.card{padding:0;overflow:hidden;margin:10px 0;background:var(--card);border:1px solid var(--line);border-radius:12px}
details.card summary{padding:14px;cursor:pointer;font-weight:600;background:var(--chip);list-style:none;display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:14px}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"▼";font-size:10px}
details.card[open] summary::after{content:"▲"}
details.card > div{padding:14px;border-top:1px solid var(--line)}

/* MODAL */
#modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 50; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
#modal .modal-content { background: var(--card); border-radius: 12px; padding: 20px; width: 100%; max-width: 400px; max-height: 80vh; overflow-y: auto; border: 1px solid var(--line); }

/* HARİTA */
.map-container { position: relative; margin-top: 10px; border-radius: 12px; overflow: hidden; background: #0f172a; border: 1px solid var(--line); }
.map-header { display: flex; justify-content: space-between; background: rgba(0,0,0,0.8); color: #fff; padding: 8px 12px; font-size: 12px; font-weight: 600; position: absolute; top: 0; left: 0; right: 0; z-index: 2; pointer-events: none; }
.zoom-controls { position: absolute; bottom: 15px; right: 15px; display: flex; flex-direction: column; gap: 6px; z-index: 2; }
.zoom-btn { background: #3b82f6; color: #fff; border: none; width: 40px; height: 40px; border-radius: 8px; font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; margin: 0; }
svg { width: 100%; height: 100%; display: block; background: #0f172a; } 
svg text { pointer-events: none; }

.clickable { cursor: pointer; transition: opacity 0.2s; }
.clickable:active { opacity: 0.6; }
.clickable-text { color: var(--acc); text-decoration: underline; cursor: pointer; }

.switch{position:relative;display:inline-block;width:46px;height:24px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(--chip);transition:.4s;border-radius:24px;border:1px solid var(--line)}
.slider:before{position:absolute;content:"";height:18px;width:18px;left:2px;bottom:2px;background:var(--mut);transition:.4s;border-radius:50%}
input:checked+.slider{background:var(--acc);border-color:var(--acc)}
input:checked+.slider:before{transform:translateX(22px);background:#fff}

/* SOSYAL MEDYA (MAKALELER) TASARIMI */
.post-card{background:var(--card);border-radius:12px;padding:14px;margin:10px 0;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.post-header{display:flex;justify-content:space-between;align-items:flex-start}
.post-avatar{width:40px;height:40px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;color:var(--acc);border:1px solid var(--line);flex-shrink:0}
.post-author{display:flex;gap:10px;align-items:center}
.post-title{font-weight:800;font-size:16px;margin:4px 0}
.post-content{font-size:14px;line-height:1.5;color:var(--ink);word-break:break-word}
.post-media{margin-top:8px;border-radius:8px;overflow:hidden;max-height:250px;display:flex;justify-content:center;align-items:center;background:#000}
.post-media img{max-width:100%;max-height:250px;object-fit:contain}
.post-actions{display:flex;gap:12px;margin-top:8px;border-top:1px solid var(--line);padding-top:10px}
.post-btn{background:none;border:none;color:var(--mut);font-size:14px;cursor:pointer;display:flex;align-items:center;gap:4px;padding:4px;width:auto;margin:0}
.post-btn.liked{color:var(--acc)}
.post-btn.disliked{color:var(--war)}
.comments-section{margin-top:10px;background:var(--chip);border-radius:8px;padding:10px;display:none}
.comment{display:flex;gap:8px;margin-bottom:8px;font-size:13px;border-bottom:1px solid var(--line);padding-bottom:6px}
.comment:last-child{border:0;margin-bottom:0;padding-bottom:0}
.comment-author{font-weight:bold;color:var(--acc)}
.comment-input-row{display:flex;gap:6px;margin-top:8px}
.comment-input-row input{padding:8px;font-size:13px}
.comment-input-row button{width:auto;padding:8px 12px;margin:0;font-size:13px}
</style>
</head>

function proj(lon,lat){
  const l=lon*Math.PI/180,p=lat*Math.PI/180,p2=p*p,p4=p2*p2;
  const x=l*(0.8707-0.131979*p2+p4*(-0.013791+p4*(0.003971*p2-0.001529*p4)));
  const y=p*(1.007226+p2*(0.015085+p4*(-0.044475+0.028874*p2-0.005916*p4)));
  return [x*160+500,-y*160+260];
}

function autoBuyTick() {
  if (!S.autoBuy || !S.autoBuy.aktif) return;
  RS.forEach(r => {
    const o = S.autoBuy.orders[r];
    if (o && o.active && o.price > 0 && o.amount > 0) {
      const q = (r == 'uranyum' || r == 'elmas' || r == 'helyum' || r == 'rivalium' || r == 'celik' || r == 'kimyasal' || r == 'plastik') ? 1 : 100;
      const currentFiyat = price(r); 
      if (currentFiyat <= o.price) {
        const birimFiyat = currentFiyat / q;
        const cost = Math.round(o.amount * birimFiyat * 1.3);
        if (S.money >= cost) {
          S.money -= cost;
          S.dp[r] = (S.dp[r] || 0) + o.amount;
          toast('🤖 Otomatik Alım: ' + fmt(o.amount) + ' ' + RL[r] + ' alındı.');
          o.active = false;
        }
      }
    }
  });
}

function autoSellTick() {
  if (!S.autoSell || !S.autoSell.aktif) return;
  RS.forEach(r => {
    const o = S.autoSell.orders[r];
    if (o && o.active && o.price > 0 && o.amount > 0) {
      const currentFiyat = price(r); 
      if (currentFiyat >= o.price && (S.dp[r]||0) >= o.amount) {
        const q = (r == 'uranyum' || r == 'elmas' || r == 'helyum' || r == 'rivalium' || r == 'celik' || r == 'kimyasal' || r == 'plastik') ? 1 : 100;
        const revenue = Math.round(o.amount * (currentFiyat / q));

        S.money += revenue;

function likePost(id) {
  const p = S.posts.find(x => x.id === id);
  if(!p) return;
  if(S.avt[id] === 1) { p.likes--; S.avt[id] = 0; }
  else {
    if(S.avt[id] === -1) p.dislikes--;
    p.likes++;
    S.avt[id] = 1;
  }
  show();
}

function dislikePost(id) {
  const p = S.posts.find(x => x.id === id);
  if(!p) return;
  if(S.avt[id] === -1) { p.dislikes--; S.avt[id] = 0; }
  else {
    if(S.avt[id] === 1) p.likes--;
    p.dislikes++;
    S.avt[id] = -1;
  }
  show();
}

const SHORT_MAX=1000;
function shortStock(h, amt) {
  const st = S.stocks[h]; if(!st) return;
  if(st.short === undefined){st.short=0;st.shortPrice=0;}
  if(st.short > 0) return toast('Zaten short pozisyonun var');
  amt = Math.max(1, Math.min(SHORT_MAX, Math.floor(+amt||0)));
  const margin = Math.ceil(amt * st.price * 1.5);
  if (S.money < margin) return toast('Teminat için ' + fmt(margin) + ' ₺ gerekir (%150).');
  S.money -= margin;
  st.short = amt; st.shortPrice = st.price; st.margin = margin;
  toast('Short açıldı: ' + amt + ' lot · teminat ' + fmt(margin) + ' ₺');
  show();
}

function coverStock(h, amt) {
  const st = S.stocks[h]; if(!st) return;
  if(!(st.short > 0)) return toast('Açık short pozisyonun yok');
  amt = Math.min(st.short, Math.max(1, Math.floor(+amt||0)));
  let profit = (st.shortPrice - st.price) * amt;
  if (st.margin === undefined) { // eski kayıt: satış geliri zaten alınmıştı
    const cost = amt * st.price;
    if (S.money < cost) return toast('Yetersiz para');
    S.money -= cost; st.short -= amt;
  } else {
    const share = st.margin * (amt / st.short);
    S.money += Math.max(0, share + profit);
    st.margin -= share; st.short -= amt;
  }
  if (st.short <= 0) { st.short = 0; st.margin = undefined; }
  toast('Pozisyon kapatıldı. Kâr/Zarar: ' + fmt(profit) + ' ₺');
  show();
}

function makeAlly(idx) {
  const a = S.ai[idx];
  if (a.ally) return;
  if (S.money < 500000) return toast('İttifak için 500.000 ₺ gerekir');

  }
  show();
}

function skipT(ms){let left=ms;while(left>0){const c=Math.min(left,28000000);S.t-=c;S.at-=c;tick();left-=c;}}

  else if(c=='event') { const i = S.sel; if(i<24) { S.ev.push({k:pk(Object.keys(EVT)), rg:i, end:n+900000}); toast('Olay tetiklendi: '+RN[i]); } }
  else if(c=='clearWars') { S.wars = []; toast('Tüm savaşlar bitti.'); }

function lawTally(b){const st=seatsT();let pro=0,con=0;Object.keys(st).forEach(p=>{const v=p==S.party?b.my:(b.bl[p]?1:-1);if(v>0)pro+=st[p];else if(v<0)con+=st[p]});return {pro,con}}
function lawArg(b){if(b.k=='name'||b.k=='siz')return b.arg;if(b.k=='tax')return '%'+b.arg;if(b.k=='cap'||b.k=='ind'||b.k=='oto'||b.k=='join')return RN[b.arg];if(b.k=='bld'){const [r,k]=String(b.arg).split(':');return RN[+r]+' · '+({med:'tıp',mil:'ordu',edu:'eğitim',dev:'gelir'}[k])}return ''}
function lawFields(){const opts=S.R.map((r,i)=>i).filter(i=>i<24&&mine(i)).map(i=>`<option value="${i}">${RN[i]}</option>`).join('');if(LK=='ind'||LK=='oto')return `<select id="lr">${S.R.map((r,i)=>i).filter(i=>i<24&&mine(i)&&i!=S.cap).map(i=>`<option value="${i}">${RN[i]}</option>`).join('')}</select>`;if(LK=='join')return `<select id="lr">${S.R.map((r,i)=>i).filter(i=>i<24&&S.R[i].o=='b'&&S.R.some((q,j)=>q.o=='sen'&&nb(i,j))).map(i=>`<option value="${i}">${RN[i]}</option>`).join('')}</select>`;if(LK=='name')return '<input id="la" maxlength="22" placeholder="Yeni ad">';if(LK=='cap')return `<select id="lr">${opts}</select>`;if(LK=='siz')return `<select id="lz">${[60,80,100,150].map(n=>`<option>${n}</option>`).join('')}</select>`;if(LK=='bld')return `<select id="lr">${opts}</select><select id="li" style="margin-top:6px"><option value="med">Tıp</option><option value="mil">Ordu</option><option value="edu">Eğitim</option><option value="dev">Gelir</option></select>`;if(LK=='tax')return `<select id="lt">${[0,5,10,15,20,25,30].map(n=>`<option value="${n}">%${n}</option>`).join('')}</select>`;return ''}
function vl(id,v){const b=S.laws.find(x=>x.id==id);if(!b)return;b.my=b.my==v?0:v;show()}
function applyLaw(b){const L=LT.find(x=>x[0]==b.k);let ok=true;
 if(b.k=='lim')S.lim=Math.min(1,S.lim+.25);
 else if(b.k=='bld'){const [r,k]=String(b.arg).split(':');if(S.bud<200000||!mine(+r))ok=false;else{S.bud-=200000;S.R[+r][k]=Math.min(11,S.R[+r][k]+1)}}
 else if(b.k=='name'){S.sname=b.arg;ST.sen[0]=b.arg}else if(b.k=='tax')S.tax=+b.arg||0;
 else if(b.k=='cap')S.cap=+b.arg;
 else if(b.k=='siz')S.psz=+b.arg;
 else if(b.k=='dik')S.gov='Diktatörlük';
 else if(b.k=='par')S.gov='Parlamenter cumhuriyet';
 else if(b.k=='sec'){S.vote='';S.voteEl=0}
 else if(b.k=='ind'){const r=S.R[+b.arg];if(r.o!='sen'||+b.arg==S.cap)ok=false;else{r.o='b';r.prot=Date.now()+600000;S.aut=S.aut.filter(x=>x!=+b.arg);if(S.home==+b.arg){const h=S.R.findIndex((q,j)=>j<24&&q.o=='sen');if(h>=0){S.home=h;S.loc=h}}}}
 else if(b.k=='oto'){if(!mine(+b.arg)||+b.arg==S.cap)ok=false;else if(!S.aut.includes(+b.arg))S.aut.push(+b.arg)}
 else if(b.k=='join'){const r=S.R[+b.arg];if(r.o!='b'||hh(b.id*5+1)<.25)ok=false;else r.o='sen'}
 S.hist.unshift((ok?'Kabul: ':'Uygulanamadı: ')+L[1]);S.hist.length=Math.min(S.hist.length,12);toast(ok?'Yasa kabul edildi: '+L[1]:'Yasa uygulanamadı (yetersiz bütçe)')}
function lawTick(n){S.laws.slice().forEach(b=>{const t=lawTally(b),L=LT.find(x=>x[0]==b.k),tot=t.pro+t.con,early=(S.gov=='Başkanlık cumhuriyeti'&&t.pro>S.psz*.5&&!['ind','dik','sec'].includes(b.k))||((b.k=='lim'||b.k=='bld')&&S.min.eco==S.name);
  if(early||n>=b.end){S.laws=S.laws.filter(x=>x!=b);if(early||(tot>0&&t.pro/tot>L[3]))applyLaw(b);else{S.hist.unshift('Reddedildi: '+L[1]);S.hist.length=Math.min(S.hist.length,12);toast('Yasa reddedildi: '+L[1])}}});
 if(Math.random()<1/900&&S.laws.length<3){const k=pk(['lim','siz']),L=LT.find(x=>x[0]==k),b={id:++S.lid,k,arg:k=='siz'?pk([60,80,100,150]):null,by:pk(S.ai).n,end:n+600000,my:0,bl:{}};PA().forEach((p,i)=>b.bl[p]=hh(b.id*13+i*7)<L[5]);S.laws.push(b);toast('Yeni yasa tasarısı: '+L[1])}}
function propose(){if(!(isDep()||leader()==S.name))return toast('Önce bir partiye gir, seçimde sandalye kazan (seviye 5)');if(S.laws.length>=3)return toast('En fazla 3 tasarı bekleyebilir');const k=LK,L=LT.find(x=>x[0]==k);if(S.money<5000)return toast('5.000 ₺ gerekir');
 let arg=null;if(L[4]=='tx'){arg=$('la').value.trim().slice(0,22);if(!arg)return toast('Ad yaz')}else if(L[4]=='rg'||L[4]=='rg2'||L[4]=='rg3'){if(!$('lr').value)return toast('Bölge seç');arg=+$('lr').value}else if(L[4]=='sz'){arg=+$('lz').value}else if(L[4]=='tx2'){arg=+$('lt').value}else if(L[4]=='ri'){if(!$('lr').value)return toast('Bölge seç');arg=$('lr').value+':'+$('li').value}
 if(k=='dik'&&leader()!=S.name)return toast('Diktatörlüğü yalnızca lider önerebilir');
 S.money-=5000;const b={id:++S.lid,k,arg,by:S.name,end:Date.now()+600000,my:0,bl:{}};PA().forEach((p,i)=>b.bl[p]=hh(b.id*13+i*7)<L[5]);
 if(S.gov=='Diktatörlük'&&k!='dik'){if(leader()==S.name||Math.random()<.6)applyLaw(b);else toast('Diktatör önerini reddetti');return show()}
 S.laws.push(b);toast('Tasarı önerildi');show()}

const pop=()=>Date.now()-(S.flash||0)<1500?'pop':'';
function wage(){let w=0;if(leader()==S.name)S.R.forEach((r,i)=>{if(i<24&&r.o=='sen')w+=r.dev<=3?6:r.dev<=7?8:10});if(S.min.eco==S.name)w+=12;if(S.min.for==S.name)w+=10;if(S.aut.includes(S.home)&&S.home!=S.cap)w+=4;return w}
function boost(k,g){if(Date.now()-S.boT<21600000)return toast('Booster 6 saatte bir kullanılır');if(g){if(S.gold<25)return toast('25 G gerekir');S.gold-=25}else{if(S.money<100000)return toast('100.000 ₺ gerekir');S.money-=100000}S.bo={k,end:Date.now()+(g?3000000:300000)};S.boT=Date.now();toast('Booster başladı: +100');show()}
function coup(i){const r=S.R[i];if(S.gold<30)return toast('30 G gerekir');if(S.wars.some(w=>w.type=='coup'&&w.a=='b'&&w.mA>=0&&S.wars.length>=5))return;if(!(r.dev<=3)||r.prot>Date.now()||S.wars.some(w=>w.t==i))return;S.gold-=30;const w=newWar(i,'b','coup');S.wsel=w.id;toast('Darbe başladı: '+RN[i]);go('war')}
function revolt(){const n=Date.now(),c=[];S.R.forEach((r,i)=>{if(i<24&&r.o!='b'&&r.dev<=3&&r.prot<n&&!S.wars.some(w=>w.t==i)&&(r.o!='sen'||(n>S.cool&&S.R.filter(x=>x.o=='sen').length>=3)))c.push(i)});
 if(Math.random()<.5){const j=Math.floor(Math.random()*24);if(S.R[j].dev>2&&S.R[j].o!='sen')S.R[j].dev--}
 if(!c.length||S.wars.length>=5)return;const t=pk(c);newWar(t,'b','rev');if(S.R[t].o=='sen')toast('⚠ '+RN[t]+' bölgesinde isyan çıktı! (gelir endeksi düşük)')}
function minH(){if(leader()!=S.name)return `<div class="card"><b>Bakanlıklar</b><div class="k">Ekonomi bakanı: ${S.min.eco=='ai'?'Murat Kılıç':esc(S.min.eco)} · Dışişleri: ${S.min.for=='ai'?'Ayşe Doğan':esc(S.min.for)}</div><p class="k">Bakanları lider atar.</p></div>`;
 const sel=(r)=>`<select onchange="S.min.${r}=this.value;show()" style="margin-top:6px"><option value="ai" ${S.min[r]=='ai'?'selected':''}>Yapay zekâ komutanı</option><option value="${esc(S.name)}" ${S.min[r]==S.name?'selected':''}>Ben (${esc(S.name)})</option></select>`;
 return `<div class="card"><b>Bakanlar atama</b><div class="k" style="margin-top:6px">Ekonomi bakanı</div>${sel('eco')}<div class="k" style="margin-top:6px">Dışişleri bakanı</div>${sel('for')}<p class="k">Günlük maaşın: ${wage()} G</p></div>`}
function dipH(){const ok=leader()==S.name||S.min.for==S.name;const st=(m,s)=>m[s]>Date.now()?Math.ceil((m[s]-Date.now())/60000)+' dk':'yok';
 return `<details class="card"><summary>Dışişleri Anlaşmaları</summary><div>`+['k','g'].map(s=>`<div class="li" style="align-items:flex-start"><span>${ST[s][0]}<div class="k">Askeri anlaşma: ${st(S.agr,s)} · yaptırım: ${st(S.sanc,s)}</div></span>${ok?`<span style="display:flex;flex-direction:column;gap:4px"><button class="sm s" onclick="agree('${s}')">Anlaşma</button><button class="sm s" onclick="sanction('${s}')">Yaptırım</button></span>`:''}</div>`).join('')+`</div></details>`}
function agree(s){if(S.money<100000)return toast('100.000 ₺ gerekir');S.money-=100000;S.agr[s]=Date.now()+3600000;S.rel[s]=Math.min(100,(S.rel[s]||0)+15);toast('Askeri anlaşma imzalandı');show()}
function sanction(s){if(S.money<100000)return toast('100.000 ₺ gerekir');S.money-=100000;S.sanc[s]=Date.now()+3600000;S.rel[s]=(S.rel[s]||0)-20;toast('Yaptırım uygulandı');show()}
function aucTick(n){if(S.auc){const a=S.auc,f=S.F.find(x=>x.id==a.fid);if(!f){S.auc=null;return}
  if(a.lead!='sen'&&Math.random()<.02&&a.price<f.lvl*.8){a.price=Math.ceil(a.price*1.08)+1;a.lead=pk(AIN)}else if(a.lead=='sen'&&Math.random()<.015&&a.price<f.lvl*.8){S.gold+=a.paid;a.paid=0;a.price=Math.ceil(a.price*1.08)+1;a.lead=pk(AIN);toast('Müzayedede teklifin geçildi, altının iade edildi')}
  if(n>=a.end){S.auc=null;S.nextAuc=n+1200000;if(a.lead=='sen'){f.own='sen';f.acc=0;toast('Müzayedeyi kazandın!')}else if(a.lead!='ai'){f.own=a.lead;toast('Müzayede bitti')}}return}
 if(n<S.nextAuc)return;const c=S.F.filter(f=>f.own!='sen'&&f.lvl>=60).sort((a,b)=>b.lvl-a.lvl)[0];if(!c){S.nextAuc=n+300000;return}
 S.auc={fid:c.id,price:Math.ceil(c.lvl/4),lead:'ai',paid:0,end:n+600000}}
function bid(){const a=S.auc;if(!a)return;if(a.lead=='sen')return toast('En yüksek teklif sende');const np=a.lead=='ai'?a.price:Math.ceil(a.price*1.1)+1;if(S.gold<np)return toast(np+' G gerekir');S.gold-=np;a.paid=np;a.price=np;a.lead='sen';toast('Teklif verildi');show()}
function aucH(){if(!S.auc){const m=Math.max(0,Math.ceil((S.nextAuc-Date.now())/60000));return `<div class="card"><b>Fabrika müzayedesi</b><p class="k">Sonraki müzayede: ${m} dk içinde.</p></div>`}
 const a=S.auc,f=S.F.find(x=>x.id==a.fid),l=Math.max(0,(a.end-Date.now())/1000);if(!f)return '';
 return `<div class="card"><b>Fabrika müzayedesi</b><div class="li"><span>${RN[f.rg]} · sv ${f.lvl}</span><b>${a.price} G</b></div><button ${a.lead=='sen'?'disabled':''} onclick="bid()">Teklif ver</button></div>`}
const WQ=[['100 kez çalış',s=>s.works-s.wb.works,100,15],['300.000 hasar ver',s=>s.dealt-s.wb.dealt,3e5,20],['2 savaş kazan',s=>s.won-s.wb.won,2,15],['Bir fabrikanı seviye 5 yap',s=>Math.max(0,...s.F.filter(f=>f.own=='sen').map(f=>f.lvl)),5,10]];
const wkIdf=()=>Math.floor(Date.now()/6048e5);
function wkTick(){if(S.wkId!=wkIdf()){S.wkId=wkIdf();S.wb={works:S.works,dealt:S.dealt,won:S.won};S.wq=[]}}
function wqH(){return `<div class="card"><b>Haftalık görevler</b>`+WQ.map((q,i)=>{const v=Math.min(q[2],q[1](S)),ok=v>=q[2],d=S.wq.includes(i);return `<div class="li"><span>${q[0]}<div class="k">${fmt(v)} / ${fmt(q[2])}</div></span><button class="sm" ${ok&&!d?'':'disabled'} onclick="wclaim(${i})">${d?'✓':'Al'}</button></div>`}).join('')+`</div>`}
function wclaim(i){const q=WQ[i];if(S.wq.includes(i)||q[1](S)<q[2])return;S.wq.push(i);S.gold+=q[3];toast('Haftalık görev: +'+q[3]+' G');show()}
function tutH(){if(S.tut)return '';const st=[['İlk işini yap',S.works>0],['Silah üret',S.st2.mk>0],['Savaş ilan et',S.st2.decl>0],['Birlik gönder',S.st2.sent>0],['Özellik öğren',S.st2.learn>0],['Devlet sekmesini aç',S.st2.state>0]];if(st.every(x=>x[1])){S.tut=1;return ''}
 return `<div class="card"><b>Başlangıç rehberi (${st.filter(x=>x[1]).length}/${st.length})</b>`+st.map(x=>`<div class="k">${x[1]?'✅':'⬜'} ${x[0]}</div>`).join('')+`<button class="s" onclick="S.tut=1;show()">Gizle</button></div>`}
const learnT=k=>(40+S.p[k]*1.5)*(1-.03*S.R[S.home].edu-.02*(S.R[S.home].lib||0))*(1-.02*S.h3.lib)/techLearnMul()*(1 - S.prestijBonuses.sci*0.05);
const rlb=s=>{const r=S.rel[s]||0;return r<-30?'Düşman':r<-10?'Gergin':r<=25?'Tarafsız':'Dostane'};
function sel(i){S.sel=i;show()}
function travel(i){const c=i>=24?60:10*dist(S.loc,i);if(i>=24&&S.un.roket<1)return toast('1 roket gerekir');if(S.en<c)return toast('Yetersiz enerji');S.en-=c;if(i>=24)S.un.roket--;S.loc=i;toast(RN[i]+' bölgesine geçtin');show()}
function setHome(i){if(S.gold<3)return toast('Yetersiz G');S.gold-=3;S.home=i;S.loc=i;toast('İkamet bölgen: '+RN[i]);show()}
function acad(i){if(S.dc2==td()||!mine(i))return;S.dc2=td();S.R[i].ma++;S.gold+=1;addExp(200);toast('Akademi seviyesi yükseldi');show()}
function declare(t){if(!canAtk(t)||S.wars.some(w=>w.a=='sen'))return;if(Date.now()<S.cool)return toast('Barış süresi');const o=S.R[t].o;if(S.rel[o]!=null)S.rel[o]-=15;const w=newWar(t,'sen');S.st2.decl++;S.wsel=w.id;toast('Savaş ilan edildi');go('war')}
function inv(i,k){const v=S.R[i][k]||0,c=20000*(v+1)**2;if(!mine(i)||v>=11)return;if(S.money<c)return toast('Yetersiz para');S.money-=c;S.R[i][k]=v+1;show()}
function buildF(t){const i=S.home;if(S.gold<20||S.dp.maden<300||S.dp.petrol<300)return toast('20 G, 300 maden, 300 petrol gerekir');S.gold-=20;S.dp.maden-=300;S.dp.petrol-=300;S.F.push({id:++S.fid,rg:i,ty:t,own:'sen',lvl:1,exp:0,sal:1,acc:0});toast('Fabrika kuruldu');show()}
function collF(id){const f=S.F.find(x=>x.id==id);if(!f)return;const a=f.acc;f.acc=0;if(f.ty=='altin')S.gold+=a;else S.dp[f.ty]=(S.dp[f.ty]||0)+a;toast('Toplandı');show()}
function wk(id){const f=S.F.find(x=>x.id==id),a=+$('ea').value;if(!f)return;if(S.en<a)return toast('Yetersiz enerji');const r=doWork(f,a,1);if(!r)return toast('Limit doldu');S.en-=a;toast('Çalışıldı');show()}
function fillE(){const n=Math.min(S.dr,Math.ceil((200-S.en)/20));if(n<1)return toast('İçecek yok');S.dr-=n;S.en=Math.min(200,S.en+n*20);show()}
function buyDr(){if(S.money<20000)return toast('Yetersiz para');S.money-=20000;S.dr+=10;show()}
function buyG(){if(S.money<30000)return toast('Yetersiz para');S.money-=30000;S.gold+=1;show()}
function mk(k,n){if(S.pq.length>=6)return toast('Hat dolu');const c=costOf(k);for(const r in c)if((S.dp[r]||0)<c[r]*n)return toast('Kaynak yetersiz');for(const r in c)S.dp[r]-=c[r]*n;enq(k,n);S.st2.mk++;show()}
function trade(r,sell){const q=(r=='uranyum'||r=='elmas'||r=='helyum'||r=='rivalium'||r=='celik'||r=='kimyasal'||r=='plastik')?1:100,p=price(r);if(sell){if((S.dp[r]||0)<q)return toast('Yetersiz stok');S.dp[r]-=q;S.money+=q*p}else{const c=Math.round(q*p*1.3);if(S.money<c)return toast('Yetersiz para');S.money-=c;S.dp[r]=(S.dp[r]||0)+q}const h=S.px[r];if(h&&h.length){const L=h.length-1;h[L]=clamp(h[L]*(sell?.985:1.015),PB[r]*.5,PB[r]*1.8)}S.trd=(S.trd||0)+1;show()}
function learn(k,g){if(S.learn)return toast('Zaten öğreniyorsun');const l=S.p[k],T=learnT(k)*(g?.1:1);if(g){const c=Math.ceil(l/8);if(S.gold<c)return toast('Yetersiz G');S.gold-=c}else{const c=l*400;if(S.money<c)return toast('Yetersiz para');S.money-=c}S.learn={k,end:Date.now()+T*1000};S.st2.learn++;toast('Öğrenme başladı');show()}
function train(){const c=Math.ceil(20*wcm());if(S.en<c)return toast('Yetersiz enerji');S.en-=c;S.mr++;addExp(120+S.lvl*2);toast('Antrenman tamamlandı');show()}
function daily(){if(S.dc==td())return;const y=new Date(Date.now()-864e5).toLocaleDateString('en-CA');S.streak=S.dc==y?S.streak+1:1;S.dc=td();const g=Math.min(10,2*S.streak),m=5000*S.streak;S.money+=m;S.gold+=g;S.en=200;toast('Günlük ödül alındı');show()}
function claimQ(i){const q=Q[i];if(S.q.includes(i)||q[1](S)<q[2])return;S.q.push(i);S.gold+=q[3];toast('Görev tamamlandı');show()}
function found(){const n=$('pn').value.trim().slice(0,20);if(!n)return toast('Parti adı yaz');if(S.money<5000)return toast('5.000 ₺ gerekir');if(AIP.includes(n))return toast('Bu ad kullanılıyor');S.money-=5000;S.party=n;show()}
function join(n){S.party=n;show()}
function vote(n){S.vote=n;S.voteEl=E();toast('Oy kaydedildi');show()}
function gift(s){if(S.money<50000)return toast('Yetersiz para');S.money-=50000;S.rel[s]=Math.min(100,(S.rel[s]||0)+10);toast('Hediye gönderildi');show()}
function expS(){const t=btoa(unescape(encodeURIComponent(JSON.stringify(Object.assign({},S,{admPin:undefined})))));$('sv').value=t;try{navigator.clipboard.writeText(t);toast('Yedek kopyalandı')}catch(e){toast('Metni elle kopyala')}}
function impS(){try{const o=JSON.parse(decodeURIComponent(escape(atob($('sv').value.trim()))));if(!Array.isArray(o.R)||o.R.length!=24||typeof o.money!='number')throw 0;S=Object.assign(fresh(),o);S.t=Date.now();S.at=Date.now();mig();save();toast('Kayıt yüklendi');show()}catch(e){toast('Geçersiz yedek')}}

function recruitSpy(){if(S.spy.agents>=spyCap())return toast('Kapasite dolu');if(S.money<30000)return toast('30.000 ₺ gerekir');S.money-=30000;S.spy.agents++;toast('Casus işe alındı');show()}
function sendSpy(target,action){if(S.spy.agents<1)return toast('Boş casus yok');if(S.spy.missions.some(m=>m.target==target))return toast('Zaten casus var');const bonus=techHas('spy1')?.20:0;S.spy.agents--;S.spy.total++;S.spy.missions.push({target,action,end:Date.now()+60000,success:Math.random()<(.5+bonus)});toast('Casus gönderildi');show()}
function spyTick(){const n=Date.now();S.spy.missions=S.spy.missions.filter(m=>{if(n<m.end)return true;const r=S.R[m.target];if(m.success){if(m.action=='steal'){const amt=Math.floor((r.res.maden.c||0)*.1);S.dp.maden=(S.dp.maden||0)+amt;toast('Casus kaynak çaldı: +'+fmt(amt)+' maden')}else if(m.action=='sabotage'){r.mil=Math.max(0,r.mil-1);toast('Sabotaj başarılı');const sIdx=S.ai.findIndex(a=>a.s==r.o);if(sIdx>=0){const st=S.stocks[AIN[sIdx%10]];if(st)st.price*=0.8;}}else if(m.action=='intel'){S.intel[RN[m.target]]={army:r.mil,dev:r.dev,money:S.tre[r.o]||0,seen:n};toast('İstihbarat alındı')}else if(m.action=='incite'){if(Math.random()<.3){newWar(m.target,'b','rev');toast('İsyan çıktı')}else toast('İsyan başarısız')}S.spy.agents++}else{S.spy.caught++;toast('⚠ Casus yakalandı!');if(r.o&&S.rel[r.o]!=null)S.rel[r.o]-=15}return false})}
function startTech(id){if(S.techQ)return toast('Araştırma var');const t=TECHS.find(x=>x.id==id);if(!t||S.tech[id])return;if(t.pre.some(p=>!S.tech[p]))return toast('Ön koşul eksik');if(S.money<t.cost)return toast('Yetersiz para');S.money-=t.cost;const speed=1+bldLvl('lab')*.10;S.techQ={id,end:Date.now()+t.time*1000/speed};toast('Araştırma başladı: '+t.n);show()}
function techTick(){if(!S.techQ)return;if(Date.now()>=S.techQ.end){const t=TECHS.find(x=>x.id==S.techQ.id);S.tech[t.id]=1;S.techQ=null;toast('✅ Araştırma tamamlandı: '+t.n);addExp(500)}}
function sendCaravan(target,resource,amount){if(S.car.length>=3)return toast('En fazla 3 kervan');if((S.dp[resource]||0)<amount||amount<1)return toast('Yetersiz kaynak');const d=dist(S.loc,target);if(d==0)return toast('Aynı bölge');S.dp[resource]-=amount;S.car.push({target,resource,amount,end:Date.now()+d*60000});toast('Kervan yola çıktı');show()}
function carTick(){const n=Date.now();S.car=S.car.filter(c=>{if(n<c.end)return true;if(Math.random()<.15){toast('⚠ Kervan soyuldu!');return false}const p=price(c.resource);const rev=Math.floor(c.amount*p*1.2);S.money+=rev;toast('Kervan ulaştı: +'+fmt(rev)+' ₺');return false})}
function buildBld(id){const b=BLDS.find(x=>x.id==id);const cur=bldLvl(id);if(cur>=b.max)return toast('Maksimum seviye');const cost=b.cost*(cur+1)**2;if(S.money<cost)return toast('Yetersiz para');S.money-=cost;S.bld[id]=cur+1;toast(b.n+' seviye '+(cur+1));show()}
function checkStory(){STORY.forEach(q=>{if(S.story.done.includes(q.id))return;if(q.chk(S)){S.story.done.push(q.id);S.money+=q.rw.m;S.gold+=q.rw.g;toast('📖 Hikaye tamamlandı! +'+fmt(q.rw.m)+' ₺')}})}

function pxTick(){const n=Date.now();if(!S.px.t)S.px.t=n-60000;const st=Math.min(60,Math.floor((n-S.px.t)/60000));if(st<1)return;S.px.t=st>=60?n:S.px.t+st*60000;
 for(const r in PB){const h=S.px[r]=S.px[r]||[PB[r]];for(let i=0;i<st;i++){let p=h[h.length-1];p+=(PB[r]-p)*.04;p*=1+(Math.random()-.5)*.05;h.push(clamp(p,PB[r]*.5,PB[r]*1.8))}if(h.length>60)h.splice(0,h.length-60)}}
function spark(r){const h=S.px[r]||[];if(h.length<3)return '';const mn=Math.min(...h),mx=Math.max(...h),w=70,ht=18;const pts=h.map((v,i)=>(i/(h.length-1)*w).toFixed(1)+','+(ht-(mx>mn?(v-mn)/(mx-mn):.5)*ht).toFixed(1)).join(' ');const up=h[h.length-1]>=h[0];
 return `<svg viewBox="0 0 ${w} ${ht}" style="width:70px;height:18px;vertical-align:middle;background:none;box-shadow:none;border-radius:0"><polyline fill="none" stroke="${up?'#2ecc71':'#e74c3c'}" stroke-width="1.5" points="${pts}"/></svg>`}
const EVT={boom:['🛢️ Kaynak patlaması','çalışma geliri ×1.3','m',1.3],grev:['✊ Grev','çalışma geliri ×0.7','m',.7],salgin:['🦠 Salgın','enerji yenilenmesi ×0.7','e',.7],fest:['🎉 Festival','enerji yenilenmesi ×1.3','e',1.3]};
function evMul(rg,kind){let x=1;(S.ev||[]).forEach(e=>{if(e.rg==rg&&Date.now()<e.end&&EVT[e.k][2]==kind)x*=EVT[e.k][3]});return x}
function evTick(){const n=Date.now();S.ev=(S.ev||[]).filter(e=>e.end>n);if(S.ev.length<3&&Math.random()<1/240){const k=pk(Object.keys(EVT)),rg=Math.floor(Math.random()*24);if(S.ev.some(e=>e.rg==rg))return;S.ev.push({k,rg,end:n+900000});if(rg==S.home||rg==S.loc||S.R[rg].o=='sen')toast('📢 '+RN[rg]+': '+EVT[k][0])}}
function evCard(){const n=Date.now(),l=(S.ev||[]).filter(e=>e.end>n);if(!l.length)return '';return `<div class="card"><b>Bölge olayları</b>`+l.map(e=>`<div class="li"><span>${EVT[e.k][0]} · ${RN[e.rg]}</span><button class="sm s" onclick="sel(${e.rg});go('map')">Git</button></div>`).join('')+`</div>`}
function awOn(){if(Date.now()<S.awEnd)return;if(S.gold<15)return toast('15 G gerekir');S.gold-=15;S.awEnd=Date.now()+864e5;toast('Otomatik savaş açık');show()}
function awTick(){const n=Date.now();if(n>=S.awEnd||n-S.awT<8000)return;S.awT=n;const w=S.wars.find(x=>x.a=='sen'||x.d=='sen');if(!w)return;const side=w.a=='sen'?'A':'D';let a0=0,rem=maxA();const o={};
 for(const k in UN){if(!okU(k,w)||S.un[k]<1||rem<=0){o[k]=0;continue}const c=Math.min(S.un[k],Math.floor(rem/UN[k].a));o[k]=c;a0+=c*UN[k].a;rem-=c*UN[k].a}
 if(a0<1)return;const a=Math.min(a0,maxA()),sc=a/a0,fr=n-S.fs>=3600000,cost=fr?0:Math.ceil(a/950*wcm());if(S.awMode=='hourly'&&!fr)return;if(S.en<cost+30)return;S.en-=cost;if(fr)S.fs=n;
 const dmg=a*dmgMul(w,side)*(.875+Math.random()*.25);if(side=='A'){w.dA+=dmg;w.mA+=dmg}else{w.dD+=dmg;w.mD+=dmg}for(const k in o)S.un[k]-=Math.floor(o[k]*sc*.03);S.dealt+=dmg;addExp(dmg/40);S.st2.sent++}
function awCard(){const on=Date.now()<S.awEnd;return `<div class="card"><b>Otomatik savaş</b><p class="k">${on?'Açık':'24 saat boyunca otomatik birlik gönderir.'}</p><button class="${on?'s':''}" ${on?'disabled':''} onclick="awOn()">${on?'Aktif':'24 saat aç (15 G)'}</button></div>`}
function rankCard(){
  const L=[{n:S.name,s:'sen',l:S.lvl,me:1},...S.ai.map(a=>({n:a.n,s:a.s,l:Math.floor(a.lvl)}))].sort((a,b)=>b.l-a.l).slice(0,8);
  const sts=['sen','k','g','b'].map(s=>({s,r:S.R.filter(r=>r.o==s).length,p:s=='sen'?armyPot():S.ai.filter(a=>a.s==s).reduce((x,a)=>x+a.pow,0)})).sort((a,b)=>b.r-a.r);
  
  return `<details class="card">
    <summary>🏆 Sıralamalar</summary>
    <div>
      <b>Oyuncu sıralaması (seviye)</b>
      ${L.map((x,i)=>`<div class="li"><span>${i+1}. ${x.me?'<b>'+esc(x.n)+'</b>':esc(x.n)} ${tag(x.s)}</span><b>${x.l}</b></div>`).join('')}
      <div style="margin-top:16px"><b>Devlet sıralaması</b></div>
      ${sts.map((x,i)=>`<div class="li"><span>${i+1}. ${tag(x.s)}</span><span class="k">${x.r} bölge</span></div>`).join('')}
    </div>
  </details>`;
}
ACH.push(['Çalışkan','🔨',s=>s.works>=100],['Ağır vurucu','💥',s=>s.dealt>=1e6],['Komutan','🎖️',s=>s.won>=5],['Seviye 25','🌟',s=>s.lvl>=25],['On milyonluk','🏦',s=>s.money>=1e7],['Tüccar','📈',s=>(s.trd||0)>=20],['Altın avcısı','🪙',s=>s.gold>=100],['İmparator','👑',s=>s.R.filter(r=>r.o=='sen').length>=10],['Sanayici','🏭',s=>s.F.filter(f=>f.own=='sen').length>=4],['Güçlü','💪',s=>s.p.str>=60]);
pxTick();

S.h3=S.h3||{gym:0,lib:0,ws:0};S.tre=S.tre||{k:3e6,g:3e6};S.prog=S.prog||{med:0,mil:0,edu:0,dev:0};S.avt=S.avt||{};
const PCOL=['#2ecc71','#e74c3c','#3498db','#f1c40f','#9b59b6','#1abc9c','#e67e22','#7f8c8d'];
function worldCard(){const pop=S.R.reduce((a,r)=>a+r.pop,0),ind=S.R.filter(r=>r.o=='b').length;return `<div class="g4" style="margin-top:0"><div class="card c clickable" onclick="go('map')" style="margin:5px 0"><div class="k">Dünya</div><b>${pop}K</b></div><div class="card c clickable" onclick="go('news')" style="margin:5px 0"><div class="k">Aktif</div><b>${S.ai.length+1}</b></div><div class="card c clickable" onclick="go('war')" style="margin:5px 0"><div class="k">Savaş</div><b>${S.wars.length}</b></div><div class="card c clickable" onclick="showRegionList('Bağımsız Bölgeler', r=>r.o=='b')" style="margin:5px 0"><div class="k">Bağımsız</div><b>${ind}</b></div></div>`}
const LAYS=[['o','Devlet'],['pop','Nüfus'],['dev','Gelişme endeksi'],['med','Tıp endeksi'],['mil','Ordu endeksi'],['edu','Eğitim endeksi'],['sav','Hava savunma'],['altin','Altın rezervi'],['petrol','Petrol rezervi'],['maden','Maden rezervi'],['uranyum','Uranyum rezervi'],['elmas','Elmas rezervi'],['war','Savaşlar']];
function layVal(i,k){const r=S.R[i];if(k=='pop')return r.pop;if(k=='sav')return r.sav||0;if(k=='war')return S.wars.some(w=>w.t==i)?1:0;if(RS.includes(k))return r.res[k].m;return r[k]||0}
function lyC(i,o){const k=S.lay||'o';if(k=='o')return ST[o][1];const mx=Math.max(1,...S.R.map((_,j)=>layVal(j,k))),v=layVal(i,k)/mx;return `hsl(${Math.round(220-v*180)},80%,${Math.round(40+v*20)}%)`}
function layerSel(){return `<select onchange="S.lay=this.value;show()" style="margin-bottom:8px">${LAYS.map(l=>`<option value="${l[0]}" ${S.lay==l[0]?'selected':''}>Veri: ${l[1]}</option>`).join('')}</select>`}
function regExtra(){const i=S.sel,r=S.R[i],o=r.o,rank=1+S.R.filter(q=>q.pop>r.pop).length;let t=`<div class="card"><b>Bölge bilgisi</b><div class="li"><span>Sıralama (nüfus)</span><b>${rank}/${S.R.length}</b></div><div class="li"><span>Hava savunma</span><b>${r.sav||0}/11</b></div>`;
 if(S.tre[o]!=null)t+=`<div class="li"><span>Devlet hazinesi</span><b>${fmt(S.tre[o])} ₺</b></div>`;
 if (mine(i)) {
   const t2 = S.tourism[i] || {otel:0, havalimani:0, muze:0};
   S.tourism[i] = t2;
   t += `<div class="li" style="flex-direction:column;align-items:flex-start;margin-top:12px;border-top:1px solid var(--line);padding-top:12px"><b>🏙️ Turizm & Altyapı</b><p class="k">Tesis kurarak saniye başı pasif gelir elde et.</p></div>`;
   const b = [ {k:'otel', n:'Otel', cost:200000, inc:2}, {k:'havalimani', n:'Havalimanı', cost:500000, inc:5}, {k:'muze', n:'Müze', cost:300000, inc:3} ];
   b.forEach(x => { t += `<div class="li"><span>${x.n} <b>Sv ${t2[x.k]||0}</b><div class="k">Gelir: +${x.inc} ₺/sn</div></span><button class="sm s" onclick="buildTourism(${i},'${x.k}')">${fmt(x.cost)} ₺</button></div>`; });
 }
 if(i >= 24 && mine(i)) { 
    t += `<div class="card" style="border:1px solid var(--acc)"><b>🛰️ Uzay Kolonisi</b>
          <p class="k">Helyum-3 ve Rivalium üretimi için özel koloni.</p>
          <button onclick="if(S.money>5000000){S.money-=5000000;S.dp.helyum=(S.dp.helyum||0)+100;S.dp.rivalium=(S.dp.rivalium||0)+50;toast('Kaynaklar çıkarıldı!');show()}else toast('5M ₺ gerekir')">Kaynak Çıkar (5M ₺)</button></div>`;
  }
 return t+`</div>`}
const _vm=V.map;V.map=function(){return _vm()+regExtra()};
const _endWar=endWar;endWar=function(w){const old=S.R[w.t].o,win=w.dA>w.dD,att=w.a;_endWar(w);if(win&&att=='sen'&&S.tre[old]!=null){const loot=Math.floor(S.tre[old]*.2);S.tre[old]-=loot;S.bud+=loot;let msg='Hazine yağması: bütçeye +'+fmt(loot)+' ₺';if(w.mA>0){S.money+=Math.floor(loot*.2);msg+=' · payın +'+fmt(loot*.2)+' ₺'}toast(msg)}};
function treTick(){const c=x=>S.R.filter(r=>r.o==x).length;S.tre.k+=c('k')*40;S.tre.g+=c('g')*40}
function fsCard(){const ty=S.fty||'hepsi',L=S.F.filter(f=>ty=='hepsi'||f.ty==ty).sort((a,b)=>b.lvl-a.lvl),n=Math.min(L.length,S.fn||10);
 return `<div class="card"><b>Fabrika arama (dünya)</b><select onchange="S.fty=this.value;S.fn=10;show()" style="margin-top:6px"><option value="hepsi">Tüm türler</option>${RS.map(t=>`<option value="${t}" ${ty==t?'selected':''}>${RI[t]} ${RL[t]}</option>`).join('')}</select>`+L.slice(0,n).map(f=>{const mx=20+Math.floor(f.lvl*.4),cur=Math.floor(mx*(.3+.6*hh(f.id*3+Math.floor(Date.now()/900000)))),sal=f.own=='sen'?100:Math.round(f.sal*100);
  return `<div class="li"><span>${RI[f.ty]} ${RL[f.ty]} · ${RN[f.rg]}<div class="k">${f.own=='sen'?'Senin':esc(f.own)} · sv ${f.lvl} · çalışan ${cur}/${mx} · maaş %${sal}</div></span>${f.rg==S.loc?`<button class="sm" onclick="wk(${f.id})">Çalış</button>`:`<button class="sm s" onclick="sel(${f.rg});go('map')">Git</button>`}</div>`}).join('')+(L.length>n?`<button class="s" onclick="S.fn=(S.fn||10)+10;show()">Daha göster...</button>`:'')+`</div>`}
const _vwk=V.work;V.work=function(){return _vwk()+fsCard()};
function hemiCard(){const st=seatsT(),ps=Object.keys(st).sort((a,b)=>st[b]-st[a]),N=S.psz,rows=4,seats=[];let tot=0;const rad=[];for(let r=0;r<rows;r++){rad.push(70+r*26)}const sumR=rad.reduce((a,b)=>a+b,0);
 rad.forEach((R,r)=>{const n=r==rows-1?N-tot:Math.round(N*R/sumR);tot+=n;for(let k=0;k<n;k++){const a=Math.PI*(n==1?.5:k/(n-1));seats.push({a,x:150-R*Math.cos(a),y:130-R*Math.sin(a)})}});
 seats.sort((p,q)=>p.a-q.a);let i=0;const col=[];ps.forEach((p,pi)=>{for(let k=0;k<st[p]&&i<seats.length;k++)col[i++]=PCOL[pi%PCOL.length]});
 return `<div class="card"><b>Meclis</b><svg viewBox="0 0 300 140" style="background:none;box-shadow:none;border-radius:0">${seats.map((q,j)=>`<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="${N>100?3.2:4.2}" fill="${col[j]||'#8a8a82'}"/>`).join('')}</svg><div class="k">${ps.map((p,pi)=>`<span style="color:${PCOL[pi%PCOL.length]}">●</span> ${esc(p)} ${st[p]}`).join(' · ')}</div></div>`}
function deptCard(){const r=S.R[S.home],own=mine(S.home);return `<div class="card"><b>Bölümlerde çalış</b><p class="k">${RN[S.home]} bölgesinin endekslerini enerjinle geliştir.</p>`+[['med','Tıp'],['mil','Ordu'],['edu','Eğitim'],['dev','Gelişme']].map(([k,n])=>{const need=60*((r[k]||0)+1),p=S.prog[k]||0;return `<div class="li"><span>${n} <b>${r[k]||0}/11</b><div class="bar"><i style="width:${Math.min(100,p/need*100)}%"></i></div></span><button class="sm" ${own&&(r[k]||0)<11?'':'disabled'} onclick="deptWork('${k}')">Çalış</button></div>`}).join('')+`</div>`}
function deptWork(k){const r=S.R[S.home];if(!mine(S.home))return toast('Bu bölge senin değil');if(S.en<20)return toast('Yetersiz enerji (20)');S.en-=20;S.prog[k]=(S.prog[k]||0)+12+S.lvl*.3;addExp(30);const need=60*((r[k]||0)+1);if(S.prog[k]>=need){S.prog[k]-=need;r[k]=(r[k]||0)+1;toast('Endeks yükseldi: '+k+' '+r[k])}show()}
const H3=[['gym','Spor salonu','savaş hasarı'],['lib','Kütüphane','öğrenme süresi −'],['ws','Atölye','silah üretim maliyeti −']];
function homeUp(k){const v=S.h3[k],c=50000*(v+1)**2;if(v>=10)return;if(S.money<c)return toast('Yetersiz para');S.money-=c;S.h3[k]=v+1;toast('Ev geliştirildi');show()}
function artV(a){return Math.round((a.h-.3)*40)+(S.avt[a.ts]||0)}
function chatSend(){const e=$('ch'),t=(e&&e.value||'').trim().slice(0,80);if(!t)return;S.aic.unshift({n:S.name+' ['+ST.sen[0]+']',m:t,t:Date.now()});S.aic.length=Math.min(S.aic.length,15);show();setTimeout(()=>{aiSay(pk(S.ai),pk(['Katılıyorum.','Cephede görüşürüz!','Petrol fiyatlarına dikkat.','Hangi bölgeye saldıracaksın?','Ordu endeksi önemli, unutma.']));if($('ch')||S.subtab=='news')show()},2500+Math.random()*3000)}

// GM Panel Fonksiyonları
let ADM=false;
function admSetPin(){const p=($('ap')||{}).value||'';if(p.trim().length<4)return toast('En az 4 karakterli bir PIN yaz');S.admPin=p.trim();ADM=true;if(!S.gbo){S.gbo=1}toast('Game Master yetkisi verildi.');show()}
function admLogin(){const p=($('ap')||{}).value||'';if(p.trim()==S.admPin){ADM=true;S.gbo=1;toast('Hoş geldin Patron');show()}else toast('Yanlış PIN')}
function admOff(){ADM=false;toast('GM paneli kapatıldı');show()}
ACH.push(['Game Master','🚀',s=>!!s.gbo]);

const _tick5=tick;tick=function(){_tick5();try{treTick()}catch(e){}};
try{document.addEventListener('visibilitychange',save)}catch(e){}
setInterval(tick,1000);setInterval(save,5000);show();
